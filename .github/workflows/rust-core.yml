name: Rust core checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check compilation and lints
        run: cargo clippy --all-targets -- -D warnings
      - name: Run cooking logic tests
        run: cargo test --all-targets
      - name: Validate native packaging script syntax
        run: python3 -m py_compile tools/package_native.py
      - name: Reject unverified mixins revision
        run: |
          if python3 tools/package_native.py --mixins invalid; then
            echo "Invalid mixins pin was incorrectly accepted"
            exit 1
          fi
